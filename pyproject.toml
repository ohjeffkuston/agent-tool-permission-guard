[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tool-permission-guard"
version = "0.1.0"
description = "Deterministic, approval-first authorization for AI agent tool-call plans"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jeffrey Ikuoyemwen"}]

[project.scripts]
agent-tool-permission-guard = "agent_tool_permission_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

