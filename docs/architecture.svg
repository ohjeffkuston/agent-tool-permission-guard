<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <rect width="1400" height="800" fill="#f7f9fc"/>
  <text x="80" y="95" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#14213d">Agent Tool Permission Guard</text>
  <text x="80" y="135" font-family="Arial, sans-serif" font-size="22" fill="#53627a">Deterministic authorization before an AI agent can act</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="250" width="260" height="190" rx="24" fill="#ffffff" stroke="#c8d2e3" stroke-width="3"/>
    <circle cx="130" cy="305" r="18" fill="#4f6bed"/>
    <text x="165" y="313" font-size="25" font-weight="700" fill="#14213d">Tool-call plan</text>
    <text x="115" y="365" font-size="19" fill="#53627a">tool · action · target</text>
    <text x="115" y="398" font-size="19" fill="#53627a">environment · risk</text>

    <rect x="430" y="210" width="360" height="270" rx="24" fill="#14213d"/>
    <text x="475" y="275" font-size="27" font-weight="700" fill="#ffffff">Policy engine</text>
    <text x="475" y="325" font-size="19" fill="#cdd7ee">priority + glob matching</text>
    <text x="475" y="360" font-size="19" fill="#cdd7ee">risk threshold</text>
    <text x="475" y="395" font-size="19" fill="#cdd7ee">fail-closed default</text>
    <text x="475" y="430" font-size="19" fill="#cdd7ee">explainable findings</text>

    <rect x="880" y="250" width="360" height="190" rx="24" fill="#ffffff" stroke="#c8d2e3" stroke-width="3"/>
    <text x="925" y="305" font-size="25" font-weight="700" fill="#14213d">Decision report</text>
    <rect x="925" y="345" width="80" height="42" rx="12" fill="#dff5e7"/>
    <text x="946" y="373" font-size="17" font-weight="700" fill="#16794b">ALLOW</text>
    <rect x="1020" y="345" width="95" height="42" rx="12" fill="#fff0cc"/>
    <text x="1034" y="373" font-size="17" font-weight="700" fill="#9a6200">REVIEW</text>
    <rect x="1130" y="345" width="75" height="42" rx="12" fill="#fde1e1"/>
    <text x="1144" y="373" font-size="17" font-weight="700" fill="#b42318">BLOCK</text>

    <line x1="340" y1="345" x2="430" y2="345" stroke="#4f6bed" stroke-width="5"/>
    <polygon points="430,345 410,333 410,357" fill="#4f6bed"/>
    <line x1="790" y1="345" x2="880" y2="345" stroke="#4f6bed" stroke-width="5"/>
    <polygon points="880,345 860,333 860,357" fill="#4f6bed"/>

    <rect x="350" y="575" width="700" height="105" rx="20" fill="#edf2ff" stroke="#b8c7f5" stroke-width="2"/>
    <text x="410" y="622" font-size="23" font-weight="700" fill="#253b80">Safety boundary</text>
    <text x="410" y="656" font-size="19" fill="#53627a">No tool execution · no credentials · human approval for non-ALLOW outcomes</text>
    <line x1="700" y1="480" x2="700" y2="575" stroke="#b8c7f5" stroke-width="4" stroke-dasharray="10 10"/>
  </g>
</svg>

