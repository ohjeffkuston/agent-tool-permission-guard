name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate JSON artifacts
        run: |
          python -m json.tool examples/tool-call-plan.json >/dev/null
          python -m json.tool n8n/permission-gate-workflow.json >/dev/null
      - name: Compile source
        run: python -m compileall -q src

